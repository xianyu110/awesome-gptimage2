name: Sync Community Cases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: sync-community-cases
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run sync tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Fetch community cases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_community_cases.py

      - name: Build canonical case library
        run: python scripts/build_case_library.py build

      - name: Validate generated data
        run: |
          python scripts/fetch_community_cases.py --check
          python scripts/build_case_library.py check
          python skills/manage-gpt-image-cases/scripts/case_library.py validate --data data/case-library.json
          node scripts/check_site.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/community-cases.json data/case-library.json; then
            echo "No community case changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community-cases.json data/case-library.json
          git commit -m "chore(data): sync case library"
          git pull --rebase origin main
          git push origin HEAD:main
